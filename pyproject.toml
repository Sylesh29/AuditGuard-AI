[tool.ruff]
line-length = 110
target-version = "py311"
src = ["backend"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["agents", "utils", "ingest", "llm", "main", "models", "pipeline",
                     "regulatory", "runs", "settings", "conftest"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["backend", "backend/tests"]
# Fail on warnings our own code triggers (e.g. pandas FutureWarning), but not on deprecation
# notices that dependencies emit about each other: those vary with installed versions.
filterwarnings = [
    "error",
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]
markers = ["slow: large-dataset performance tests"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.File"]
